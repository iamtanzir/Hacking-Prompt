name: redteam eval checks

on:
  push:
    paths:
      - 'redteam/**'
      - 'blue/**'
      - 'scripts/**'
      - 'docs/**'
      - '*.md'
      - '.github/workflows/redteam.yml'
  pull_request:
    paths:
      - 'redteam/**'
      - 'blue/**'
      - 'scripts/**'
      - 'docs/**'
      - '*.md'
      - '.github/workflows/redteam.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate case file
        run: node redteam/validate.mjs --strict
      - name: Check every tool has a case
        run: node redteam/coverage.mjs
      - name: Check every tool has a blue-team control
        run: node blue/check.mjs
      - name: Typecheck (JSDoc over the .mjs sources)
        run: npx --no-install tsc -p tsconfig.json
      - name: Unit tests with coverage
        # No path arguments: the runner does not expand directories on Node 22, and
        # auto-discovery finds every *.test.mjs outside node_modules.
        run: node --test --experimental-test-coverage
      - name: Scorer smoke test on bundled samples
        run: node redteam/score.mjs redteam/results.example.jsonl
      - name: Runner dry run
        run: node redteam/run.mjs --dry-run --limit 1
      - name: Judge dry run
        run: node redteam/judge.mjs redteam/results.example.jsonl --dry-run
      - name: Report smoke test
        run: node redteam/report.mjs redteam/results.example.jsonl --out /tmp/report.md
